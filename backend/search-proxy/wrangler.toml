name = "kikomix-search-proxy"
main = "worker.js"
compatibility_date = "2026-09-23"

# Jamendo requires a free client_id (https://devportal.jamendo.com) --
# Deezer and the iTunes Search API need no key at all. Set it as a secret,
# never a plaintext var, even though it's a "public" catalog id:
#   npx wrangler secret put JAMENDO_CLIENT_ID
